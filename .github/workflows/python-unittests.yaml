name: Python Unittests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unittest:
    strategy:
      matrix: ${{ fromJSON(github.event_name == 'pull_request'
        && '{"include":[{"python-version":"3.12","platform":"linux.24_04.4x"}]}'
        || '{"include":[{"python-version":"3.10","platform":"linux.24_04.4x"},{"python-version":"3.12","platform":"linux.24_04.4x"},{"python-version":"3.12","platform":"macos-15-xlarge"}]}') }}
      fail-fast: false
    timeout-minutes: 20
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout TorchX
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: |
          set -eux
          uv sync --frozen --extra dev
      - name: Run tests
        run: |
          set -eux
          uv run pytest
